<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf7ef">
  <meta name="description" content="Skapa ett föräldrakonto för att komma igång med spanskaövningarna.">
  <title>Skapa föräldrakonto — Hola!</title>
  <style>
    :root{color-scheme:light;--ink:#20291f;--muted:#74766c;--green:#285c43;--paper:#faf7ef;--line:#e8e2d5;--card:#fffdf8;--coral:#d96b4b}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 88% 8%,#f1e9d9 0,transparent 29rem),var(--paper);color:var(--ink);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em}
    a{color:inherit;text-underline-offset:3px}
    .card{position:relative;width:min(480px,100%);padding:34px 30px 30px;border:1px solid #ebe5da;border-radius:23px;background:var(--card);box-shadow:0 22px 70px #20291f1c}
    .brand{display:inline-block;margin-bottom:25px;color:var(--green);font-size:.9rem;font-weight:850;letter-spacing:-.02em;text-decoration:none}
    .eyebrow{margin:0 0 8px;color:var(--coral);font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:2rem;font-weight:500;letter-spacing:-.055em;line-height:1.15}
    .intro{margin:8px 0 23px;color:var(--muted)}
    .field{display:grid;gap:7px;margin-top:15px}
    .field label,.consent{font-size:.9rem;font-weight:750}
    .field input{width:100%;min-height:49px;padding:11px 13px;border:1px solid #d9d4c8;border-radius:11px;background:white;color:var(--ink);font:inherit}
    .field input:focus-visible,.consent input:focus-visible{outline:3px solid #d99563;outline-offset:2px}
    .hint{margin:-1px 0 0;color:var(--muted);font-size:.82rem}
    .consent{display:flex;align-items:flex-start;gap:10px;margin-top:19px;color:#505449;font-weight:550;line-height:1.45}
    .consent input{width:18px;height:18px;flex:0 0 18px;margin:2px 0 0;accent-color:var(--green)}
    .consent a{color:var(--green)}
    .submit{display:flex;width:100%;min-height:51px;align-items:center;justify-content:center;margin-top:21px;border:0;border-radius:999px;background:var(--green);color:white;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 8px 18px #285c4320}
    .submit:hover{background:#1e4934}.submit:disabled{opacity:.65;cursor:wait}
    .notice{min-height:24px;margin:12px 0 0;color:#9d4634;font-size:.9rem}.notice[data-tone=success]{color:var(--green)}
    .links{display:grid;gap:10px;margin-top:18px;padding-top:17px;border-top:1px solid var(--line);font-size:.92rem}
    .links a:hover{color:var(--green)}
    #privacy-dialog{width:min(760px,calc(100% - 28px));max-width:none;max-height:calc(100dvh - 28px);overflow:auto;padding:30px;border:1px solid #ebe5da;border-radius:22px;background:#fffdf8;color:var(--ink);box-shadow:0 22px 70px #20291f35}
    #privacy-dialog::backdrop{background:#20291f70;backdrop-filter:blur(3px)}
    #privacy-dialog h2{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:2rem;font-weight:500;letter-spacing:-.055em}
    .dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}
    .dialog-copy{margin:6px 0 20px;color:var(--muted)}
    .dialog-close{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:#fffefa;color:var(--ink);font-size:1.2rem;cursor:pointer}
    .privacy-dialog-content{padding-top:18px;border-top:1px solid var(--line);color:var(--muted);line-height:1.65}
    .privacy-dialog-content p{margin:0 0 14px}.privacy-dialog-content p:last-child{margin-bottom:0}
    .privacy-dialog-content a{color:var(--green);text-underline-offset:3px}
    @media(max-width:480px){#privacy-dialog{padding:23px}}
    @media(max-width:480px){body{padding:16px}.card{padding:28px 22px 24px;border-radius:20px}h1{font-size:1.8rem}}
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="index.html">Hecho con cariño <span aria-hidden="true">·</span> En liten början på din spanska.</a>
    <p class="eyebrow">Kom igång</p>
    <h1>Skapa föräldrakonto</h1>
    <p class="intro">Kontot är till för en vårdnadshavare. Du skapar barnkonton när du har loggat in.</p>
    <form id="reg">
      <div class="field"><label for="username">Användarnamn</label><input id="username" name="username" minlength="3" maxlength="30" autocomplete="username" placeholder="Välj ett användarnamn" required></div>
      <div class="field"><label for="password">Lösenord</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" placeholder="Minst 8 tecken" required><p class="hint">Använd minst 8 tecken.</p></div>
      <div class="field"><label for="invite-code">Inbjudningskod</label><input id="invite-code" name="inviteCode" autocomplete="off" placeholder="Ange din inbjudningskod" required></div>
      <label class="consent"><input name="guardianConsent" type="checkbox" required><span>Jag är vårdnadshavare och har läst <a href="privacy.html" class="open-privacy-dialog">integritetstexten</a>. Jag godkänner behandlingen enligt den.</span></label>
      <button class="submit" type="submit">Skapa konto</button>
      <p class="notice" id="msg" role="status" aria-live="polite"></p>
    </form>
    <nav class="links" aria-label="Kontohjälp"><a href="login.html">Till inloggning</a><a href="privacy.html" class="open-privacy-dialog">Läs om integritet</a></nav>
  </main>
  <dialog id="privacy-dialog" aria-labelledby="privacy-dialog-title">
    <div class="dialog-head">
      <div><h2 id="privacy-dialog-title">Integritet</h2><p class="dialog-copy">Information om kontouppgifter och övningsresultat.</p></div>
      <button type="button" class="dialog-close" id="close-privacy-dialog" aria-label="Stäng integritetsinformationen">×</button>
    </div>
    <div class="privacy-dialog-content" id="register-privacy-content"></div>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script><script src="auth-common.js"></script><script src="privacy-content.js"></script>
  <script>
    const privacyDialog=document.querySelector("#privacy-dialog"),privacyContent=document.querySelector("#register-privacy-content");
    document.querySelector("#close-privacy-dialog").addEventListener("click",()=>privacyDialog.close());
    document.querySelectorAll(".open-privacy-dialog").forEach(link=>link.addEventListener("click",event=>{
      event.preventDefault();
      if(!privacyContent.dataset.loaded){HolaPrivacy.render(privacyContent);privacyContent.dataset.loaded="true";}
      privacyDialog.showModal();
    }));
    document.querySelector("#reg").addEventListener("submit",async event=>{
      event.preventDefault();
      const form=event.currentTarget,fields=new FormData(form),msg=document.querySelector("#msg"),button=form.querySelector("button");
      msg.textContent="";msg.dataset.tone="";button.disabled=true;button.textContent="Skapar konto…";
      try{
        await SpanskaAuth.publicApi("/api/register-parent",{username:String(fields.get("username")).trim().toLowerCase(),password:fields.get("password"),inviteCode:fields.get("inviteCode"),guardianConsent:fields.get("guardianConsent")==="on"});
        msg.textContent="Kontot skapades. Du kan nu logga in.";msg.dataset.tone="success";form.reset();
      }catch(error){msg.textContent=error.message||"Kontot kunde inte skapas. Försök igen.";}
      finally{button.disabled=false;button.textContent="Skapa konto";}
    });
  </script>
</body>
</html>
