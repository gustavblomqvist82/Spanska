<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Föräldrakonto — Hola!</title></head><body><main><h1>Skapa föräldrakonto</h1><p>Kontot är avsett för en vårdnadshavare. Barnkonton skapas sedan inloggad.</p><form id="reg"><label>Användarnamn <input name="username" minlength="3" maxlength="30" autocomplete="username" required></label><label>Lösenord (minst 8 tecken) <input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Inbjudningskod <input name="inviteCode" required></label><label><input name="guardianConsent" type="checkbox" required> Jag är vårdnadshavare och intygar att jag har tagit del av integritetstexten och godkänner behandlingen enligt den.</label><button>Skapa konto</button></form><p id="msg" role="status"></p><a href="login.html">Till inloggning</a> · <a href="privacy.html">Integritet</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth-common.js"></script><script>document.querySelector("#reg").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.currentTarget),msg=document.querySelector("#msg");try{await SpanskaAuth.publicApi("/api/register-parent",{username:f.get("username"),password:f.get("password"),inviteCode:f.get("inviteCode"),guardianConsent:f.get("guardianConsent")==="on"});msg.textContent="Kontot skapades. Du kan nu logga in.";e.currentTarget.reset();}catch(err){msg.textContent=err.message;}});</script></body></html>
