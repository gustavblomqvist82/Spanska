<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Mitt konto — Hola!</title></head><body><main><h1>Mitt konto</h1><p>Hantera barnkonton. Använd smeknamn, inte barnets riktiga namn.</p><form id="child"><label>Användarnamn <input name="username" required minlength="3"></label><label>Smeknamn <input name="nickname" required maxlength="30"></label><label>Lösenord <input name="password" type="password" required minlength="8"></label><button>Skapa barnkonto</button></form><p id="msg" role="status"></p><h2>Barnkonton</h2><ul id="children"></ul><p><a href="index.html">Till spelen</a> · <a href="privacy.html">Integritet</a></p><section><h2>Radera familjekonto</h2><p>Detta raderar föräldrakontot, barnkonton och sparade resultat permanent.</p><form id="delete"><label>Skriv användarnamnet för att bekräfta <input name="confirmUsername" required></label><button>Radera hela familjekontot</button></form></section><button id="out">Logga ut</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth-common.js"></script><script>SpanskaAuth.requireLogin();const list=document.querySelector("#children"),msg=document.querySelector("#msg");async function load(){try{const d=await SpanskaAuth.api("/api/children",undefined,"GET");list.replaceChildren(...d.children.map(c=>{const li=document.createElement("li");const label=document.createElement("p");label.textContent=c.username+" ("+c.nickname+")";const edit=document.createElement("button");edit.type="button";edit.textContent="Ändra smeknamn eller lösenord";edit.addEventListener("click",async()=>{const nickname=prompt("Nytt smeknamn för "+c.username+":",c.nickname);if(nickname===null)return;const password=prompt("Nytt lösenord (minst 8 tecken), eller lämna tomt för att behålla nuvarande:","");if(password===null)return;try{await SpanskaAuth.api("/api/children/"+encodeURIComponent(c.id),{nickname,password},"PATCH");msg.textContent="Barnkontot uppdaterades.";load();}catch(e){msg.textContent=e.message;}});const b=document.createElement("button");b.type="button";b.textContent="Radera barnkonto";b.addEventListener("click",async()=>{if(!confirm("Radera barnkontot och dess sparade resultat?"))return;try{await SpanskaAuth.api("/api/children/"+encodeURIComponent(c.id),undefined,"DELETE");load();}catch(e){msg.textContent=e.message;}});li.append(label,edit,b);return li;}));}catch(e){msg.textContent=e.message;}}document.querySelector("#child").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await SpanskaAuth.api("/api/children",{username:f.get("username"),nickname:f.get("nickname"),password:f.get("password")});e.currentTarget.reset();msg.textContent="Barnkontot skapades.";load();}catch(err){msg.textContent=err.message;}});document.querySelector("#delete").addEventListener("submit",async e=>{e.preventDefault();if(!confirm("Ska hela familjens konto och alla resultat raderas permanent?"))return;try{await SpanskaAuth.api("/api/delete-account",{confirmUsername:new FormData(e.currentTarget).get("confirmUsername")});await SpanskaAuth.logout();}catch(err){msg.textContent=err.message;}});document.querySelector("#out").onclick=()=>SpanskaAuth.logout();load();</script></body></html>
