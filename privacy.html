<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf7ef">
  <meta name="description" content="Läs om hur Hola! hanterar konton och övningsresultat.">
  <title>Integritet — Hola!</title>
  <style>
    :root{color-scheme:light;--ink:#20291f;--muted:#74766c;--green:#285c43;--paper:#faf7ef;--line:#e8e2d5;--card:#fffdf8;--coral:#d96b4b}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 88% 8%,#f1e9d9 0,transparent 29rem),var(--paper);color:var(--ink);font:16px/1.65 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em}
    a{color:var(--green);text-underline-offset:3px}
    .card{width:min(760px,100%);padding:34px 36px 30px;border:1px solid #ebe5da;border-radius:23px;background:var(--card);box-shadow:0 22px 70px #20291f1c}
    .brand{display:inline-block;margin-bottom:25px;color:var(--green);font-size:.9rem;font-weight:850;letter-spacing:-.02em;text-decoration:none}
    .eyebrow{margin:0 0 8px;color:var(--coral);font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:2.55rem;font-weight:500;letter-spacing:-.06em;line-height:1.15}
    .intro{margin:8px 0 24px;color:var(--muted)}
    .privacy-content{padding-top:19px;border-top:1px solid var(--line)}
    .privacy-content p{margin:0 0 16px;color:#55584f}
    .privacy-content p:last-child{margin-bottom:0}
    .back{display:inline-flex;margin-top:24px;padding:10px 15px;border:1px solid var(--line);border-radius:999px;color:var(--ink);font-weight:700;text-decoration:none}
    .back:hover{background:#f1eee5;color:var(--green)}
    :focus-visible{outline:3px solid #d99563;outline-offset:3px}
    @media(max-width:560px){body{padding:16px}.card{padding:27px 22px 24px;border-radius:20px}h1{font-size:2.1rem}}
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="index.html">Hecho con cariño <span aria-hidden="true">·</span> En liten början på din spanska.</a>
    <p class="eyebrow">Trygghet och ansvar</p>
    <h1>Integritet</h1>
    <p class="intro">Här kan du läsa om hur kontouppgifter och övningsresultat hanteras på webbplatsen.</p>
    <div class="privacy-content" id="privacy-content"></div>
    <a class="back" href="index.html">Tillbaka till hemsidan</a>
  </main>
  <script src="privacy-content.js"></script>
  <script>HolaPrivacy.render(document.querySelector("#privacy-content"));</script>
</body>
</html>
