<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Logga in — Hola!</title></head><body><main><h1>Logga in</h1><p id="notice" role="status"></p><form id="login"><label>Användarnamn <input name="username" autocomplete="username" required></label><label>Lösenord <input name="password" type="password" autocomplete="current-password" required></label><button>Logga in</button></form><p><a href="register.html">Skapa föräldrakonto</a></p><a href="privacy.html">Integritet</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth-common.js"></script><script>
const f=document.querySelector("#login"), n=document.querySelector("#notice"); if(new URLSearchParams(location.search).has("setup")) n.textContent="Webbplatsen är inte färdigkopplad: fyll i Project URL och publishable key i supabase-config.js."; f.addEventListener("submit",async e=>{e.preventDefault(); const fd=new FormData(f),u=String(fd.get("username")).trim().toLowerCase(); try {if(!SpanskaAuth.ready) throw Error("Supabase-inställningarna saknas.");const {error}=await SpanskaAuth.client.auth.signInWithPassword({email:u+"@konto.invalid",password:fd.get("password")});if(error)throw error; location.replace("index.html");}catch(err){n.textContent="Kunde inte logga in. Kontrollera användarnamn och lösenord.";}});
</script></body></html>
